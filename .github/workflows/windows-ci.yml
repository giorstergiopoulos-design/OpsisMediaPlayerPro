name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/SubtitleTests -c Release
      - name: Build the player
        run: dotnet build OpsisMediaPlayerPro.csproj -c Release
